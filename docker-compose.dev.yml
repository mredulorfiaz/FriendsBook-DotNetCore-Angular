version: '3.8'

services:
  # MySQL Database
  friendsbook-db:
    image: mysql:8.0
    container_name: friendsbook-db-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: friendsbook123
      MYSQL_DATABASE: friendsbook
      MYSQL_USER: friendsbook
      MYSQL_PASSWORD: friendsbook123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
      - ./FriendsBookAPI/mysql.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - friendsbook-network

  # .NET API (Development with hot reload)
  friendsbook-api:
    build:
      context: ./FriendsBookAPI
      dockerfile: Dockerfile.dev
    container_name: friendsbook-api-dev
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=server=friendsbook-db;port=3306;database=friendsbook;uid=friendsbook;password=friendsbook123;
      - ASPNETCORE_URLS=http://+:5000
    ports:
      - "5000:5000"
    depends_on:
      - friendsbook-db
    networks:
      - friendsbook-network
    volumes:
      - ./FriendsBookAPI:/app
      - /app/bin
      - /app/obj
    working_dir: /app

  # Angular SPA (Development with hot reload)
  friendsbook-spa:
    build:
      context: ./FriendsBookSPA
      dockerfile: Dockerfile.dev
    container_name: friendsbook-spa-dev
    restart: unless-stopped
    ports:
      - "4200:4200"
    depends_on:
      - friendsbook-api
    networks:
      - friendsbook-network
    environment:
      - API_URL=http://localhost:5000
    volumes:
      - ./FriendsBookSPA:/app
      - /app/node_modules
    working_dir: /app

volumes:
  mysql_data_dev:

networks:
  friendsbook-network:
    driver: bridge